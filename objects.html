<!DOCTYPE html>
<html lang="en">
<head>

<body class="objects">
  <div class="page">
    <a class="back" href="index.html">&larr; Home</a>

    <h1>Objects Created</h1>

    <!--
      HOW TO ADD SOMETHING
      1. Copy one whole <article> ... </article> block below and paste it after the last one.
      2. Change the number, title, details and description.
      3. Optional picture: upload the image to your repo, then delete the
         comment marks around the <img> line and put the file name in src.
      4. Optional audio: same idea with the <audio> line (mp3 works well).
      5. Optional link: change the href on the "View" link, or delete that line.
      To remove an item, delete its whole <article> block.
    -->

    <section class="grid" aria-label="Objects">

      <article class="object">
        <!-- <img src="your-image.jpg" alt="Describe the picture"> -->
        <!-- <audio controls src="your-audio.mp3"></audio> -->
        <p class="num">01</p>
        <h2>Title of your first object</h2>
        <p class="meta">Year &middot; Medium</p>
        <p class="desc">One or two sentences about what it is.</p>
        <a class="more" href="#">View &#8599;</a>
      </article>

      <article class="object">
        <!-- <img src="your-image.jpg" alt="Describe the picture"> -->
        <p class="num">02</p>
        <h2>Title of your second object</h2>
        <p class="meta">Year &middot; Medium</p>
        <p class="desc">One or two sentences about what it is.</p>
      </article>

      <article class="object">
        <!-- <img src="your-image.jpg" alt="Describe the picture"> -->
        <p class="num">03</p>
        <h2>Title of your third object</h2>
        <p class="meta">Year &middot; Medium</p>
        <p class="desc">One or two sentences about what it is.</p>
      </article>

    </section>
  </div>
</body>
</html>
