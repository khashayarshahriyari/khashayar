<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objects Created</title>
  <meta name="description" content="PhD student in Music Theory at Washington University in St. Louis.">
  <style>
    :root {
      --ink: #f4f1ea;
      --ink-soft: rgba(244, 241, 234, 0.88);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: #1a1a1a;
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    /* Background photo lives on a fixed layer so it behaves on phones too. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.30) 38%, rgba(0, 0, 0, 0) 62%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0) 30%),
        url("background.jpg") 55% center / cover no-repeat;
    }

    main {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(24px, 5vw, 72px);
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.5rem, 7vw, 5.25rem);
      line-height: 1.02;
      letter-spacing: 0.005em;
      text-shadow: 0 1px 24px rgba(0, 0, 0, 0.35);
    }

    .about {
      max-width: 36rem;
    }

    .about p {
      margin: 0 0 1.5rem;
      font-size: clamp(1.05rem, 1.6vw, 1.2rem);
      line-height: 1.65;
      color: var(--ink-soft);
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 2rem;
    }

    .links a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(244, 241, 234, 0.5);
      transition: border-color 0.2s ease;
    }

    .links a:hover { border-bottom-color: var(--ink); }

    .links a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
      border-bottom-color: transparent;
    }
  </style>
</head>
<body>
  <main>
    <h1>Objects Created</h1>

    <section class="about">
      <p>
        I'm a PhD student in Music Theory at Washington University in St. Louis.
        I received my Bachelor's degree in Music Composition from Tehran University of Art.
      </p>

      <nav class="links" aria-label="Links">
        <!-- Replace the href below with your Google Drive CV share link -->
        <a href="PASTE_YOUR_GOOGLE_DRIVE_CV_LINK_HERE" target="_blank" rel="noopener noreferrer">Curriculum Vitae &#8599;</a>
        <a href="https://music.wustl.edu" target="_blank" rel="noopener noreferrer">WashU Department of Music &#8599;</a>
      </nav>
    </section>
  </main>
</body>
</html>
